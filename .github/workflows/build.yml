name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then SDKM=sdkmanager
          else SDKM="$(ls -d ${ANDROID_HOME}/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1)"; fi
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: ls -la app/build/outputs/apk/debug/

      - name: Create Release
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            -t "星火英语 v1.0.${{ github.run_number }}" \
            -n "Android 安装包（debug 签名，可直接安装）"
        env:
          GH_TOKEN: ${{ github.token }}
